<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Inventory</title>
</head>
<body>
    <h1>Book Inventory</h1>

    <!-- Add Book Form -->
    <form action="/books/add" method="post">
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="author" placeholder="Author" required>
        <input type="text" name="genre" placeholder="Genre">
        <input type="text" name="category" placeholder="Category">
        <input type="date" name="publicationDate">
        <input type="text" name="isbn" placeholder="ISBN">
        <input type="number" step="0.01" name="price" placeholder="Price">
        <button type="submit">Add Book</button>
    </form>

    <!-- Filter Form -->
    <form action="/books/filter" method="post">
        <input type="text" name="title" placeholder="Filter by Title">
        <input type="text" name="author" placeholder="Filter by Author">
        <input type="text" name="genre" placeholder="Filter by Genre">
        <button type="submit">Filter Books</button>
    </form>

    <!-- Sorting Links -->
    <a href="/books/sort/title">Sort by Title</a> |
    <a href="/books/sort/author">Sort by Author</a>

    <!-- Book Table -->
    <table border="1">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Category</th>
                <th>Publication Date</th>
                <th>ISBN</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.genre}"></td>
                <td th:text="${book.category}"></td>
                <td th:text="${book.publicationDate}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.price}"></td>
                <td>
                    <a th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Export Buttons -->
    <form action="/books/export/csv" method="get">
        <button type="submit">Export as CSV</button>
    </form>
    <form action="/books/export/json" method="get">
        <button type="submit">Export as JSON</button>
    </form>

    <!-- Search Form -->
    <form action="/search" method="get">
        <input type="text" name="title" placeholder="Search by title">
        <button type="submit">Search</button>
    </form>

    <!-- Category Filter Dropdown -->
    <form action="/books/filter" method="get">
        <select name="category">
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="Non-Fiction">Non-Fiction</option>
        </select>
        <button type="submit">Filter</button>
    </form>
</body>
</html>
